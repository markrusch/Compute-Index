[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-compute-index"
version = "0.1.0"
description = "EU-CRI: a daily, methodology-transparent EU GPU rental price index"
requires-python = ">=3.11"
authors = [{ name = "Mark Rusch", email = "rusch.mh@gmail.com" }]
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.10",
    "responses>=0.25",
    "types-requests",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eucri = ["migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/eucri/methodology.py" = ["E501"]  # markdown table rows in the doc template

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["eucri.index", "eucri.normalise"]
disallow_untyped_defs = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
